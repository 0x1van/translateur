[project]
name = "translator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.129.0",
    "httpx>=0.27",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.41.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-playwright>=0.6", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "--ignore=qa_live.py"
