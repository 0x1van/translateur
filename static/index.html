<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="translateur">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f071a" media="(prefers-color-scheme: dark)">
<title>translateur</title>
<script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="/" title="translateur"><img src="/static/icon-192.png" alt="translateur"></a>
  <label>project <select id="preset"></select></label>
  <button id="voices-btn" type="button" title="project settings" aria-label="project settings">&#9881;&#xFE0E;</button>
  <button id="copy-btn" type="button" title="copy the whole English text">copy english</button>
  <a class="btn" href="/api/picks" target="_blank" title="every variant you chose, one JSON line each">choices</a>
  <button id="theme-btn" type="button" aria-label="Toggle dark theme">dark</button>
  <span id="status" class="status" aria-live="polite"></span>
</header>

<div class="shell">
  <aside class="tree" aria-label="Works">
    <div class="tree-head"><h2>works</h2><button id="new-btn" type="button" title="new work or project">+ new</button></div>
    <ul id="works"></ul>
  </aside>
  <main id="grid" class="grid" aria-label="Source and translation">
    <p class="empty">no work open · pick one on the left, or <em>+ new</em></p>
  </main>
</div>

<div id="pop" class="pop" hidden role="dialog"></div>

<dialog id="new-dialog">
  <form method="dialog" id="new-form">
    <label>slug <input name="slug" pattern="[a-z0-9][a-z0-9\-]*" required placeholder="gooseberries"></label>
    <div class="two">
      <label>project <select name="project"></select></label>
      <label>title (optional) <input name="title" placeholder="Крыжовник"></label>
    </div>
    <label class="new-project" hidden>new project name (lowercase, hyphens) <input name="project_name" pattern="[a-z0-9][a-z0-9\-]*" placeholder="gooseberries-chekhov"></label>
    <p class="hint">then paste the Russian into the left pane · a blank line starts a new paragraph ·</p>
    <div class="row-end"><button value="cancel" type="button" class="cancel">cancel</button><button value="ok">create</button></div>
  </form>
</dialog>

<dialog id="voices-dialog">
  <form method="dialog" id="voices-form">
    <p class="hint">a few sentences about the text and how you want it to read, in your own words · the app writes the rest of the prompt ·</p>
    <label>model <select id="model"></select></label>
    <label>about this project <textarea name="description" rows="6" placeholder="Chekhov, 1890s, faithful and unshowy; quiet precision, no modernising."></textarea></label>
    <div class="freedom">
      <label>A freedom <select name="A_freedom"></select></label>
      <label>B freedom <select name="B_freedom"></select></label>
      <label>C freedom <select name="C_freedom"></select></label>
    </div>
    <label class="check"><input type="checkbox" name="blind"> show A alone first, B and C on request (draft-blind)</label>
    <div class="row-end"><a class="btn export" download title="the project's files and works, in the store's layout">export as zip</a><button type="button" class="reset">reset</button><button type="button" class="cancel">cancel</button><button value="ok">save</button></div>
  </form>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
