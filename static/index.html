<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>translator · nova·nevédoma</title>
<script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="bar">
  <span class="brand">nova·nevédoma · translator</span>
  <label>project <select id="preset"></select></label>
  <button id="voices-btn" type="button">system prompt</button>
  <label>model <select id="model"></select></label>
  <button id="theme-btn" type="button" aria-label="Toggle dark theme">dark</button>
  <span id="status" class="status" aria-live="polite"></span>
</header>

<div class="shell">
  <aside class="tree" aria-label="Works">
    <h2>works</h2>
    <ul id="works"></ul>
    <button id="new-btn" type="button">+ new</button>
  </aside>
  <main id="grid" class="grid" aria-label="Source and translation">
    <p class="empty">no work open · pick one on the left, or <em>+ new</em></p>
  </main>
</div>

<div id="pop" class="pop" hidden role="dialog"></div>

<dialog id="new-dialog">
  <form method="dialog" id="new-form">
    <label>slug <input name="slug" pattern="[a-z0-9][a-z0-9-]*" required placeholder="gooseberries"></label>
    <label>russian source (markdown, blank line between paragraphs)
      <textarea name="source" rows="12" lang="ru" required></textarea></label>
    <div class="row-end"><button value="cancel" type="button" class="cancel">cancel</button><button value="ok">create</button></div>
  </form>
</dialog>

<dialog id="voices-dialog">
  <form method="dialog" id="voices-form">
    <p class="hint">the system prompt · describe voices A, B and C in it however you like · edits are kept in this browser per project ·</p>
    <label>system prompt <textarea name="context" rows="16"></textarea></label>
    <div class="freedom">
      <label>A freedom <select name="A_freedom"></select></label>
      <label>B freedom <select name="B_freedom"></select></label>
      <label>C freedom <select name="C_freedom"></select></label>
    </div>
    <div class="row-end"><button type="button" class="reset">reset to preset</button><button type="button" class="cancel">cancel</button><button value="ok">save</button></div>
  </form>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
